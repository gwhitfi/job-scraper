[profile]
target_role = "software developer"
mode = "adjacent"                      # "strict" (exact only) | "adjacent" (exact, near, maybe)
# Other names for the target role; always exact matches
core_examples = [
  "software engineer",
  "developer",
  "dev",
  "programmer",
  "web developer",
  "application developer",
  "front-end/back-end/full-stack developer",
  "SWE",
]
adjacent_examples = [
  "IT support",
  "data analyst",
  "software QA/test",
  "general internship programs",
  "partner/customer escalation support",
]
exclude_examples = [
  "product manager",
  "project manager",
  "manufacturing quality",
  "mechanical/electrical engineering",
  "PLC/controls technician",
]
levels = ["intern", "entry", "mid"]    # allowed: intern, entry, mid, senior, lead
keywords = ["programming", "software", "developer"]

# Named city lists usable in a company's `locations`.
