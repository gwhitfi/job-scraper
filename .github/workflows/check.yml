name: Check jobs

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours, off the top of the hour when Actions is busiest
  workflow_dispatch:

permissions:
  contents: write # push to the state branch

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    # Runs on my PC: Move Upstate SC blocks GitHub's cloud IPs. While the PC is off, GitHub
    # keeps one queued run and starts it when the runner comes back (up to 24 hours).
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # state/ is a worktree of the `state` branch so bot commits stay out of main.
      # The self-hosted workspace persists between runs, so clear the last run's worktree first.
      - name: Check out state branch
        run: |
          rm -rf state
          git worktree prune
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            git fetch --depth=1 origin state
            git worktree add --detach state FETCH_HEAD
          else
            git worktree add --orphan -B state state
          fi

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked --no-dev

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: uv run jobscraper run

      # Skipped if the run failed, so the next run re-detects the same changes and retries the email.
      - name: Save state
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Update state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:state

      # The web page (jobscraper serve) reads this copy; mv keeps each swap atomic.
      - name: Publish state for the web page
        run: |
          dest="$HOME/.local/share/jobscraper/state"
          mkdir -p "$dest"
          for f in postings.json health.json email.json; do
            [ -f "state/$f" ] || continue
            cp "state/$f" "$dest/$f.tmp"
            mv "$dest/$f.tmp" "$dest/$f"
          done
