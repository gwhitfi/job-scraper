<script nonce="fa41fdf0c5ee2538171a556d187c7e77" type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Spartanburg Regional Healthcare System","sameAs":"https://careers.spartanburgregional.com/us/en","url":"https://careers.spartanburgregional.com/us/en/job/SRHSRHUSP108781EXTERNALENUS/Radiology-Tech-Evenings","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"34.93873","longitude":"-82.22706"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Greer","addressRegion":"South Carolina"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","description":"&lt;strong&gt;Job Requirements &lt;/strong&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Spartanburg Regional Healthcare System&lt;/strong&gt;&lt;br&gt;&nbsp;&lt;/p&gt;&lt;p&gt;Now offering new opportunities for you to join our team of healthcare staff to expand your career within our Diagnostic family as a Radiologic Technologist with expectations of growth and experience. You will utilize your extensive knowledge of patient care, patient advocacy, clinical pathways/care maps, team dynamics, and hospital systems. As a resource for both registered technologists and supporting staff, you will collaborate with leadership to shape and implement our vibrant culture, vision, mission, and goals.&lt;br&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Diagnostic Unit&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;br&gt;Consider joining our team of exceptional staff as we explore the world from within. With your talents, we will bring patient care to another level of excellence. We offer advance radiology procedures including:&lt;br&gt;•Diagnostic imaging, including inpatient, outpatient, emergency center, OR and imaging throughout the facility&lt;br&gt;•Fluoroscopy, including procedures such as but not limited to swallow studies, arthrograms, VCUG&lt;br&gt;•Working alongside of Radiologists, Speech Therapists, Lead Technologists&lt;br&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why This Role?&lt;/strong&gt;&lt;br&gt;•Extensive Training: Develop expertise with in-depth training.&lt;br&gt;•Team Collaboration: Thrive in a team-oriented environment where strong communication is key.&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Position Summary&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;Under the direction of the Director of Radiology and the Medical Director the staff radiographer performs radiographic procedures. Performs a variety of technical procedures that require independent judgment, with ingenuity and initiative to apply ionized radiation prescribed by physicians for radiologic diagnosis.&nbsp;&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Minimum Requirements&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Education&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Graduate from American Medical Association (AMA)-approved School of Radiologic Technologist&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Experience&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Zero- three years' experience at technologist level&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;License/Registration/Certifications&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Current South Carolina Radiation Quality Standards Association Certification&lt;/li&gt;&lt;li&gt;Current American Registry of Radiologic Technologist License&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Preferred Requirements&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Preferred Education&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;N/A&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Preferred Experience&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;N/A&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Preferred License/Registration/Certifications&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;N/A&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&nbsp;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&nbsp;Core Job Responsibilities&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Perform a variety of tasks involved in operating x-ray equipment to make radiographs of designated body portions. Adjust equipment for proper radiographic exposure techniques in accordance with radiation safety guidelines.&lt;/li&gt;&lt;li&gt;Evaluate X-Ray images for technical quality, collate processed images in sequence per protocol and appropriately label.&nbsp;Complete appropriate documentation on all systems, mark review and transmit to PACS in a timely manner.&lt;/li&gt;&lt;li&gt;Assist other healthcare professionals with imaging procedures, starting IV's, delivery of oral contrast and injecting contrast, when applicable.&lt;/li&gt;&lt;li&gt;Assist radiologist/physicians with fluoroscopic X-ray and interventional procedures in the department and other areas where portable radiographic equipment is utilized&lt;/li&gt;&lt;li&gt;Positively responds and implements change when needed and has good decision-making skills.&lt;/li&gt;&lt;li&gt;Assists with quality control and maintenance of all equipment in the area&lt;/li&gt;&lt;li&gt;Properly utilize accessory equipment such as injectors, patient moving devices, stretchers, warmers, scanners, printers, and PACS workstations&lt;/li&gt;&lt;li&gt;Prepare patients for procedures, explain procedures to patients. Report changes in patient condition to medical staff. Provide an oral and/or written clinical history to the radiologist and other healthcare professionals.&lt;/li&gt;&lt;li&gt;Assists in training of new staff and students during clinical rotations&lt;/li&gt;&lt;li&gt;Follows, maintains and helps implement hospital and departmental policies and procedures&lt;/li&gt;&lt;li&gt;Consistently communicates with patients, guests, staff and physicians in a positive manner&lt;/li&gt;&lt;li&gt;Knowledgeable of compliance and regulatory requirements and adheres to Federal, State, accrediting bodies, and standard practice of care for patients, staff, guests and facilities&lt;/li&gt;&lt;li&gt;Adheres to departmental procedures and protocols&lt;/li&gt;&lt;li&gt;Rotating call schedules for after hours and holidays where applicable&lt;/li&gt;&lt;li&gt;Ensure correct charging of procedures and supplies daily&lt;/li&gt;&lt;li&gt;Works as a team member with peers and other departments.&nbsp;Responds calmly and efficiently to situations.&lt;/li&gt;&lt;li&gt;Regularly attend departmental meeting, in-services and actively participate in continuing education activities&lt;/li&gt;&lt;li&gt;Other duties as requested by supervisor or manager&lt;/li&gt;&lt;li&gt;May be assigned to cover additional shifts as required to meet departmental needs&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&nbsp;&lt;/p&gt;&lt;br&gt;&lt;br&gt;","datePosted":"2026-10-10","title":"Radiology-Tech","@context":"http://schema.org","occupationalCategory":"Allied Health Careers","directApply":false,"workHours":"40 hours per week","skills":"radiologic technologist license, american registry of radiologic technologists certification, radiographic procedures, x-ray equipment operation, fluoroscopic procedures, radiation safety, pacs, quality control, patient preparation, clinical documentation, regulatory compliance, team collaboration, patient advocacy, clinical training, decision making, interdepartmental communication, equipment maintenance, patient history collection, procedure charging, change implementation, MRI Technologist, Radiologic Technologist, Ultrasound Technologist, Technologist, Medical Technologist, Patient Care Technician II Unit Clerk, Emergency Department Technician, Medical Assistant, Surgical Scheduler & Medical Receptionist, Patient Care Assistant"}</script>
