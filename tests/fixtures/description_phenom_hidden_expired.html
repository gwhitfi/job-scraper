<script nonce="665605a41b432a763a9668d609fe51d6" type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Spartanburg Regional Healthcare System","sameAs":"https://careers.spartanburgregional.com/us/en","url":"https://careers.spartanburgregional.com/us/en/job/SRHSRHUSP108730EXTERNALENUS/Director-of-Construction-and-Renovation","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"34.94957","longitude":"-81.93205"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Spartanburg","addressRegion":"South Carolina"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","description":"&lt;strong&gt;Job Requirements &lt;/strong&gt;&lt;br&gt;&lt;p&gt;Join &lt;strong&gt;Spartanburg Regional Healthcare System&lt;/strong&gt;, one of the largest and most comprehensive healthcare providers in the Southeast, serving communities across Upstate South Carolina. With a network of five hospitals and a continued commitment to growth and expansion, Spartanburg Regional offers an exceptional opportunity to make a lasting impact in a thriving healthcare environment. Located in the Upstate region, the area offers an outstanding quality of life, featuring a low cost of living, excellent schools, vibrant downtowns, and convenient access to the Blue Ridge Mountains, Charlotte, and Greenville.&lt;/p&gt;&lt;p&gt;The Director of Construction and Renovation is responsible for leading multiple complex projects simultaneously across the healthcare system. This role oversees all aspects of construction and renovation operations, ensuring projects are completed safely, on schedule, and within budget. Responsibilities include strategic planning, project estimating, scheduling, resource allocation, management of RFI and submittal processes, and ensuring compliance with all regulatory and safety requirements. The Director partners closely with Infection Prevention and Safety teams to develop and maintain policies that ensure all construction and renovation activities meet healthcare-specific infection control standards and regulatory guidelines. Additionally, this leader builds and maintains high-performing project teams, fostering collaboration and accountability while serving as a trusted advisor to departments throughout the organization to solve problems, support operational needs, and help maintain the exceptional quality of care provided to our patients and communities.&lt;/p&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong style=\"color: black;\"&gt;Minimum Requirements&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Education&lt;/strong&gt;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Associate’s degree in an engineering, construction, or project management field.&lt;/li&gt;&lt;li&gt;In place of an associate’s degree, a High School Diploma along with 10 years’ experience in an engineering / construction discipline within a healthcare setting.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Experience&lt;/strong&gt;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Must have previous experience with DNV standards as well as OSHA, CMS, and DHEC/DPH regulations and AIA guidelines.&lt;/li&gt;&lt;li&gt;Experience in preparing contract documents along with knowledge of architecture, engineering, construction, and building activation.&lt;/li&gt;&lt;li&gt;Knowledge and experience in capital equipment planning, budgeting, and operational management.&lt;/li&gt;&lt;li&gt;Excellent planning, decision making, prioritizing, and goal achievement skills are essential.&lt;/li&gt;&lt;li&gt;Must be flexible in working with deadlines, changing priorities, and changing organizational imperatives.&lt;/li&gt;&lt;li&gt;Experience working with large and complex organizations.&lt;/li&gt;&lt;li&gt;Analytical in the review and use of information related to building, fire, and life safety.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;License/Registration/Certifications&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Must hold an unlimited SC General Contractors License&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong style=\"color: black;\"&gt;Preferred Requirements&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Preferred Education&lt;/strong&gt;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Bachelor’s degree in engineering, Construction or Project Management&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Preferred Experience&lt;/strong&gt;&nbsp;&nbsp;&nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experience in mechanical, HVAC, electrical systems, and construction activities&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Preferred License/Registration/Certifications&nbsp;&nbsp;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;An MEP discipline&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong style=\"color: black;\"&gt;Core Job Responsibilities&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Ensures all projects conform 100% to all federal, state, and local codes and regulations as well as all NFPA Life Safety and International Building Codes.&lt;/li&gt;&lt;li&gt;Preparation of all bid documents and contracts through the OAC for all subcontractors and equipment vendors.&lt;/li&gt;&lt;li&gt;Ensures all staff, subcontractors, and vendors as part construction renovation projects maintain compliance with all regulations put forth by the AHJ’s and hospital policies.&lt;/li&gt;&lt;li&gt;Monitor, control, track, and report on each individual project budget and schedule.&lt;/li&gt;&lt;li&gt;Develop strategies and best practices for construction renovation projects to foster positive departmental interactions and improve satisfaction within the hospital system.&lt;/li&gt;&lt;li&gt;Track all required federal, state, and local documentation / records and ensure all documentation is available and filed correctly&lt;/li&gt;&lt;li&gt;Participate in the Facilities department administrative call schedule and works hand in hand with the operations side of Facilities to assist in problems as they arise.&lt;/li&gt;&lt;li&gt;Evaluates performance of the team in order to ensure the achievement of the team’s objectives.&lt;/li&gt;&lt;li&gt;Coordination with any outside parties related to project management and owners’ rep with construction projects not self-performed by SRHS.&lt;/li&gt;&lt;li&gt;Other duties as assigned&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;br&gt;","datePosted":"2026-10-13","title":"Director of Construction and Renovation","@context":"http://schema.org","occupationalCategory":"Non-Clinical Support Careers","directApply":false,"workHours":"40 hours per week"}</script>
