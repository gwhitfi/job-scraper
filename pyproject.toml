[project]
name = "jobscraper"
version = "0.1.0"
description = "Watch company career pages and email new relevant job postings."
readme = "docs/PROJECT.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "python-dotenv>=1.2.4",
]

[project.scripts]
jobscraper = "jobscraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
